<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths exams</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='24' viewBox='0 0 24 24' width='24'%3E%3Cpath fill='%23ffffff' d='M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }

        /* Setup overlay */
        #setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #setup-overlay.hidden {
            display: none;
        }

        .setup-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-height: 90vh; /* Constrains the window to 90% of the screen height */
            overflow-y: auto; /* Adds a scrollbar only when the content gets too long */
        }

        .setup-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1.05rem;
            color: #000;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #555;
        }

        .duration-row {
            display: flex;
            gap: 10px;
        }

        .duration-row input {
            flex: 1;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }

        .setup-cancel {
            background: none;
            color: #999;
            font-size: 0.9rem;
            text-decoration: underline;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            border: none;
            margin-top: 2px;
            display: none;
        }

        .setup-cancel:hover {
            color: #000;
        }

        /* Timer view */
        #timer-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 0 40px 80px;
            flex-direction: column;
            align-items: center;
        }

        #timer-view.active {
            display: flex;
        }

        /* Fixed Sticky Header */
        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            /* Reduced padding to shrink standard size */
            padding: 10px 15px; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 24px; /* Reduced from 36px */
            position: sticky;
            top: 0;
            z-index: 100;
            
            /* --- NEW PROPERTIES FOR RESIZING & SCROLLING --- */
            resize: vertical;
            overflow: hidden; /* Changed from auto to hide the date when shrunk */
            min-height: 60px; 
            max-height: 60vh;
        }
        
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .current-date {
            font-size: 0.85rem;
            color: #777;
            margin-top: 4px;
            font-weight: 500;
            white-space: pre; /* Ensures the spaces around the | character are respected */
        }

        .header-add-btn {
            height: 44px; /* Slightly smaller button */
            padding: 0 20px;
            background-color: #000;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .header-add-btn:hover {
            opacity: 0.85;
        }

        .header-add-btn:active {
            transform: translateY(2px);
        }

        .current-time-label {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 2px;
        }

        .current-time {
            font-size: 2.4rem; /* Reduced from 4rem */
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .next-announcement-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .announcement-label {
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .announcement-time {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s, background-color 0.3s;
        }

        /* Which exam(s) the next announcement belongs to (only shown with 2+ timers) */
        .announcement-exam {
            font-size: 0.8rem;
            font-weight: 600;
            color: #777;
            margin-top: 2px;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .announcement-exam:empty {
            display: none;
        }

        .announcement-exam > div {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .announcement-exam-extra {
            color: #d97706;
        }

        /* Distinct Hue for Next Announcement when it's an Extra Time Warning */
        .next-announcement-block.is-extra-warning .announcement-time {
            color: #d97706 !important;
            background-color: #fef3c7;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .next-announcement-block.is-extra-warning .announcement-label {
            color: #d97706 !important;
        }

        /* Card grid */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 24px;
            width: 100%;
        }

        .exam-card {
            border: 4px solid;
            border-radius: 14px;
            padding: 28px 32px;
            position: relative;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.2s, opacity 0.2s;
            overflow: hidden;
            
            /* Flexbox sizing and resizing */
            flex: 0 1 auto;             /* Changed flex-grow to 0 so it respects manual resizing */
            width: calc(25% - 24px);    /* Sets a base width of 4 columns */
            min-width: 280px;           
            min-height: 250px;
            max-width: 100%;
            resize: both; /* Both horizontal and vertical resizing will now work */
        }

        /* New inner wrapper to handle container queries without breaking resize */
        .exam-card-inner {
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .exam-card.dragging {
            opacity: 0.4;
            box-shadow: none;
        }

        .exam-card.drag-over { 
		opacity: 0.4 !important;
		border: 2px dashed #4b5563 !important; 
		transform: scale(0.98);
}

        .exam-card:active {
            cursor: grabbing;
        }

        .exam-card.ib {
            border-color: #1a56db;
        }

        .exam-card.igcse {
            border-color: #dc2626;
        }

        .exam-card.maths {
            border-color: #FFDA03;
        }

		.exam-card.custom {
			border-color: #000000;
		}

        .card-remove {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .card-remove:hover {
            color: #666;
        }

        .card-edit {
            position: absolute;
            top: 10px;
            right: 40px; /* Shifted left to accommodate the 'X' */
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #bbb;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .card-edit:hover {
            color: #666;
        }

        .exam-name {
            font-size: 3.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
            line-height: 1.1; /* Fixes vertical text alignment / cropping */
            padding: 0 20px; /* Prevents long titles from hitting the 'X' button */
            overflow-wrap: anywhere; /* Long single words wrap instead of spilling out of narrow cards */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .exam-board-label {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .exam-card.ib .exam-board-label {
            color: #1a56db;
        }

        .exam-card.igcse .exam-board-label {
            color: #dc2626;
        }

        .exam-card.maths .exam-board-label {
            color: #FFDA03;
        }
		
		.exam-card.custom .exam-board-label {
            color: #000000;
        }

        .exam-duration-label {
            font-size: 1.1rem;
            color: #777;
            text-align: center;
            margin-bottom: 10px;
        }

        .time-rows {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .time-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .time-row .value {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* --- Robust CSS Variable Theme Engine --- */
        .exam-card {
            --card-base-bg: #ffffff; /* The default background color of the card */
        }
        
        /* Define the exact theme color for each board */
        .exam-card.ib { --board-theme-color: #1a56db; --board-theme-muted: #9eb6ef; }
        .exam-card.igcse { --board-theme-color: #dc2626; --board-theme-muted: #f1a5a5; }
        .exam-card.maths { --board-theme-color: #FFDA03; --board-theme-muted: #ffe866; }
        .exam-card.custom { --board-theme-color: #000000; --board-theme-muted: #999999; }

        /* Unified Time Row Highlights (For ALL boards EXCEPT Maths) */
        #cards-grid .exam-card:not(.maths) .time-row[class*="highlighted-"],
        #cards-grid .exam-card:not(.maths) .start-edit-row[class*="highlighted-"] {
            background-color: var(--board-theme-color) !important;
            color: var(--card-base-bg) !important;
        }

        /* Maths Exception: Warning row highlight stays Yellow Background, Black Font */
        #cards-grid .exam-card.maths .time-row.highlighted-maths,
        #cards-grid .exam-card.maths .start-edit-row.highlighted-maths {
            background-color: #FFDA03 !important;
            color: #000000 !important;
        }
        
        /* Extra-time warning (not listed on the card): lighter-hue chip on the matching
           warning label, plus the EXTRA TIME label as context indicator */
        .exam-card .time-row .label.active-extra-warning,
        .exam-card .time-row .label.active-extra-indicator {
            background-color: var(--board-theme-muted) !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }

        .countdown-section {
            margin-top: auto;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
            /* Removed position: relative; so the banner anchors to the main card boundaries instead */
        }

        /* --- Exam Finished Banner --- */
        .exam-finished-banner {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none; /* Hidden until timer hits 0, switched to flex in JS */
            
            /* Uses the exact mathematical polygon calculated by JS, with a fallback */
            clip-path: var(--banner-clip, polygon(0% 80%, 20% 100%, 100% 20%, 80% 0%));
            
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: #fff;
            background: #dc2626; /* Ensure you have a background color so the shape is visible! */
            container-type: size; 
        }

        /* --- The Decorative Inset Frame --- */
        .exam-finished-frame {
            position: absolute;
            /* Insets the frame by 12px total relative to geometric bounds */
            width: calc(var(--banner-length) - 12px);
            height: calc(var(--banner-thickness) - 12px);
            transform: rotate(var(--banner-angle, 0rad));
            
            /* currentColor preserves your theme colors (e.g., black for Maths) */
            border: 2px solid currentColor; 
            border-radius: 4px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .exam-finished-text {
            /* Forces the text container to exactly match the length of segment UV */
            width: var(--uv-length);
            
            /* Dynamically sizes the font based on the UV length, capped against vertical overflow */
            font-size: min(calc(var(--uv-length) * 0.075), calc(var(--banner-thickness) * 0.45)); 
            
            /* Centers the string perfectly inside the UV segment */
            text-align: center;
            
            color: inherit; 
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
            
            /* The frame handles the rotation, so text stays flat inside */
            transform: none; 
        }

        .exam-card.ib .exam-finished-banner { background-color: #1a56db; }
        .exam-card.igcse .exam-finished-banner { background-color: #dc2626; }
        .exam-card.custom .exam-finished-banner { background-color: #000; }
        .exam-card.maths .exam-finished-banner { 
            background-color: #FFDA03; 
            color: #000; 
            border-color: #000; 
        }

        /* --- Regular Time Badge --- */
        .end-label-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .badge-regular {
            display: inline-block;
            background-color: #888;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            /* Dynamically scales down font size if the card gets too narrow */
            font-size: min(0.75rem, 3.5cqi); 
            margin-left: 0; /* Align left edge cleanly with END */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap; /* Forces text to stay safely on a single line */
        }

        .countdown-status {
            font-size: 1.1rem;
            font-weight: 500;
            color: #777;
            margin-bottom: 4px;
        }

        .countdown-time {
            display: inline-block;
            /* clamp(MIN, PREFERRED, MAX) using Container Query Inline (cqi) */
            font-size: clamp(2.5rem, 20cqi, 6rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 4px 18px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
            white-space: nowrap; /* Forces the digits to stay on a single line */
            letter-spacing: -2px; /* Pulls the digits slightly closer together */
        }

        /* --- Base Countdown Colors (For ALL boards EXCEPT Maths) --- */
        #cards-grid .exam-card:not(.maths) .countdown-time {
            color: var(--board-theme-color);
            background-color: transparent;
        }

        /* --- Active Announcement Highlight (For ALL boards EXCEPT Maths) --- */
        #cards-grid .exam-card:not(.maths) .countdown-time[class*="highlighted-"] {
            background-color: var(--board-theme-color) !important;
            color: var(--card-base-bg) !important;
        }

        /* =========================================
           MATHS OLYMPIADS - EXCLUSIVE TIMER COLORS
           ========================================= */
           
        /* 1. DEFAULT STATE (JS applies the highlight class normally) */
        html body #cards-grid .exam-card.maths .countdown-time[class*="highlighted"] {
            background-color: #FFDA03 !important;
            color: #000000 !important;
        }
        
        /* Bulletproof: Force EVERY inner text element to be black */
        html body #cards-grid .exam-card.maths .countdown-time[class*="highlighted"] * {
            color: #000000 !important;
        }

        /* 2. ANNOUNCEMENT MINUTE (JS removes the class) */
        html body #cards-grid .exam-card.maths .countdown-time {
            background-color: #000000 !important;
            color: #FFDA03 !important;
        }
        
        /* Bulletproof: Force EVERY inner text element to swap to yellow */
        html body #cards-grid .exam-card.maths .countdown-time * {
            color: #FFDA03 !important;
        }

        /* Editable start time */
        .start-edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .start-edit-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .start-edit-input {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 2px 6px; /* Increased right padding slightly */
            background: transparent;
            color: inherit;
            outline: none;
            text-align: right;
            
            /* A generous fixed width ensures the final zero is NEVER clipped */
            width: 120px; 
            
            /* Pushes exactly 8px rightward to seamlessly align text with the rows above/below */
            margin-right: -8px; 

            /* Browser address-bar style text-truncation behavior */
            overflow: hidden;
            white-space: nowrap;
            text-overflow: clip;
        }

        .start-edit-input:focus,
        .start-edit-input:hover {
            border-color: currentColor;
            background: rgba(0, 0, 0, 0.05);
        }

        .start-edit-input::-webkit-calendar-picker-indicator,
        .start-edit-input::-webkit-inner-spin-button,
        .start-edit-input::-webkit-clear-button {
            -webkit-appearance: none;
            appearance: none;
            display: none !important;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
        }

        /* Toast popup */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 32px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            z-index: 200;
            text-align: center;
            max-width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }

        #toast.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #toast-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #toast-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #toast p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
        }

        #toast button {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
        }

        #toast button:hover {
            opacity: 0.85;
        }

        /* Bottom controls */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-bottom {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 0.95rem;
            color: #555;
            cursor: pointer;
        }

        .btn-bottom:hover {
            background: #eee;
            color: #000;
        }

        /* Hidden file input */
        #file-input {
            display: none;
        }

        /* GitHub link */
        .github-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #bbb;
            line-height: 0;
            z-index: 150;
            transition: color 0.2s;
        }

        .github-link:hover {
            color: #000;
        }

        .github-link svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }
        .form-group input[type="checkbox"],
        input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            cursor: pointer;
        }

        #extra-time-value:disabled, #extra-time-type:disabled, #reading-duration:disabled {
            opacity: 0.4;
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        /* Responsive: small desktops / large tablets -> 3 columns */
        @media (max-width: 1100px) {
            .exam-card {
                width: calc(33.33% - 24px); /* Switches to 3 columns */
            }
        }

        /* Responsive: tablets (iPad portrait) -> 2 columns */
        @media (max-width: 820px) {
            .exam-name {
                font-size: 2.6rem;
            }

            /* Countdown keeps its container-relative clamp() sizing so it always fits the card */

            .exam-card {
                width: calc(50% - 24px); /* Switches to 2 columns */
            }

            #timer-view {
                padding-left: 20px;
                padding-right: 20px;
            }

            /* Header is mirrored on wide screens; keep one copy of each control when space is tight */
            .timer-header .header-side-left.header-add-btn,
            .timer-header .next-announcement-block.header-side-right {
                display: none;
            }

            .timer-header {
                gap: 12px;
            }
        }

        /* Responsive: phones -> single column */
        @media (max-width: 560px) {
            #timer-view {
                padding: 24px 16px 96px;
            }

            /* Clock on its own row, announcement + Add button share the row below */

    <script>
        const MAX_TIMERS = 16;
        const timers = [];
        let nextId = 1;
        let tickInterval = null;

        const setupOverlay = document.getElementById('setup-overlay');
        const timerView = document.getElementById('timer-view');
        const cardsGrid = document.getElementById('cards-grid');
        const btnCancel = document.getElementById('btn-cancel');

        // --- Banner Geometry Observer ---
        const bannerObserver = new ResizeObserver((entries) => {
            for (let entry of entries) {
                const card = entry.target;
                
                // L is Horizontal width, W is Vertical height
                const L = card.clientWidth;  
                const W = card.clientHeight; 
                
                // Prevent calculations if the card is hidden or collapsed
                if (L === 0 && W === 0) continue;
                
                const a = Math.min(L, W);
                const b = Math.max(L, W);
                
                let h, v;
                if (b === W) {
                    h = 0.05 * a;
                    v = 0.20 * a;
                } else {
                    h = 0.20 * a;
                    v = 0.05 * a;
                }

                const den = W * W + L * L;
                const L2 = L * L;
                const W2 = W * W;

                // Point A 
                const Ax = h;
                const Ay = v;

                // Point B (Corrected orthogonal projection)
                const Bx = (2 * v * L * W + h * L2 - h * W2) / den;
                const By = (2 * h * L * W + v * W2 - v * L2) / den;

                // Point C 
                const Cx = L - h;
                const Cy = W - v;

                // Point D 
                const Dx = L - Bx;
                const Dy = W - By;

                // --- Calculate Midpoint M and the 4 Inset Points (A', B', C', D') ---
                const Mx = (Ax + Cx) / 2;
                const My = (Ay + Cy) / 2;
                
                // Define individual offsets (5% inset)
                const frameOffset = 0.05;
                const textOffset = 0.05;

                // Apply linear interpolation: (1 - offset) * POINT + offset * MIDPOINT
                const A_px = (1 - frameOffset) * Ax + frameOffset * Mx;
                const A_py = (1 - frameOffset) * Ay + frameOffset * My;

                const B_px = (1 - frameOffset) * Bx + frameOffset * Mx;
                const B_py = (1 - frameOffset) * By + frameOffset * My;

                const C_px = (1 - frameOffset) * Cx + frameOffset * Mx;
                const C_py = (1 - frameOffset) * Cy + frameOffset * My;

                const D_px = (1 - frameOffset) * Dx + frameOffset * Mx;
                const D_py = (1 - frameOffset) * Dy + frameOffset * My;

                // --- Calculate Text Span Segment UV ---
                // Midpoints of the inner frame's short edges (A'B' and C'D')
                const M_AB_x = (A_px + B_px) / 2;
                const M_AB_y = (A_py + B_py) / 2;
                
                const M_CD_x = (C_px + D_px) / 2;
                const M_CD_y = (C_py + D_py) / 2;

                // U and V pulled inward towards the exact center of the card (M)
                const U_x = (1 - textOffset) * M_AB_x + textOffset * Mx;
                const U_y = (1 - textOffset) * M_AB_y + textOffset * My;
                
                const V_x = (1 - textOffset) * M_CD_x + textOffset * Mx;
                const V_y = (1 - textOffset) * M_CD_y + textOffset * My;

                // Calculate the exact pixel length of the UV segment
                const uvLength = Math.hypot(V_x - U_x, V_y - U_y);

                // --- Calculate dimensions and EXACT angle for the decorative frame ---
                const rectThickness = Math.hypot(B_px - A_px, B_py - A_py);
                const rectLength = Math.hypot(D_px - A_px, D_py - A_py);

                // Calculate the exact angle of the inner frame's long edge (A' to D')
                const angleRad = Math.atan2(A_py - D_py, D_px - A_px);
                
                // Pass all geometric variables to CSS for real-time redrawing
                card.style.setProperty('--banner-thickness', `${rectThickness}px`);
                card.style.setProperty('--banner-length', `${rectLength}px`);
                card.style.setProperty('--uv-length', `${uvLength}px`);
                card.style.setProperty('--banner-angle', `${angleRad}rad`);

                // Map to CSS coordinates (Inverting Y: W - y) to match Top-Left CSS origin
                const polygon = `polygon(
                    ${Ax}px ${W - Ay}px, 
                    ${Bx}px ${W - By}px, 
                    ${Cx}px ${W - Cy}px, 
                    ${Dx}px ${W - Dy}px
                )`;
                card.style.setProperty('--banner-clip', polygon);
            }
        });

        // Board presets: the single source of every per-board default.
        //   type        → colour theme / CSS class (ib, igcse, maths, custom)
        //   label       → text shown at the top of the card
        //   durationMin → default duration
        //   warnings    → default warning checkboxes (minutes before the end)
        //   readingMin  → default reading time (0 = off)
        //   extraPct    → default extra time in % (0 = off)
        const IB_DEFAULTS    = { type: 'ib',    warnings: [30, 5], readingMin: 5, extraPct: 25 };
        const IGCSE_DEFAULTS = { type: 'igcse', warnings: [5],     readingMin: 0, extraPct: 25 };
        const MATHS_DEFAULTS = { type: 'maths',                    readingMin: 0, extraPct: 0 };

        const examPresets = {
            "Custom":            { type: 'custom', label: 'Custom', durationMin: 45, warnings: [5], readingMin: 0, extraPct: 25 },

            "ib-higher-p1":      { ...IB_DEFAULTS, label: 'IB - Higher Paper 1',   durationMin: 120 },
            "ib-higher-p2":      { ...IB_DEFAULTS, label: 'IB - Higher Paper 2',   durationMin: 120 },
            "ib-higher-p3":      { ...IB_DEFAULTS, label: 'IB - Higher Paper 3',   durationMin: 75 },
            "ib-standard-p1":    { ...IB_DEFAULTS, label: 'IB - Standard Paper 1', durationMin: 90 },
            "ib-standard-p2":    { ...IB_DEFAULTS, label: 'IB - Standard Paper 2', durationMin: 90 },
            "IB":                { ...IB_DEFAULTS, label: 'IB (Custom)',           durationMin: 90 },

            "igcse-ext-p2":      { ...IGCSE_DEFAULTS, label: 'IGCSE - Extended Paper 2',   durationMin: 90 },
            "igcse-ext-p4":      { ...IGCSE_DEFAULTS, label: 'IGCSE - Extended Paper 4',   durationMin: 90 },
            "igcse-ext-p6":      { ...IGCSE_DEFAULTS, label: 'IGCSE - Extended Paper 6',   durationMin: 90 },
            "igcse-add-p1":      { ...IGCSE_DEFAULTS, label: 'IGCSE - Additional Paper 1', durationMin: 120 },
            "igcse-add-p2":      { ...IGCSE_DEFAULTS, label: 'IGCSE - Additional Paper 2', durationMin: 120 },
            "IGCSE":             { ...IGCSE_DEFAULTS, label: 'IGCSE (Custom)',             durationMin: 90 },

            "maths-kangaroo":    { ...MATHS_DEFAULTS, label: 'Maths Kangaroo',       durationMin: 100, warnings: [20, 5] },
            "maths-obmep":       { ...MATHS_DEFAULTS, label: 'Maths OBMEP',          durationMin: 150, warnings: [20, 5] },
            "maths-jacob-palis": { ...MATHS_DEFAULTS, label: 'Maths Jacob Palis Jr', durationMin: 150, warnings: [15, 5] }
        };

        // Preset for a board; unknown boards (e.g. from an edited save file) fall back to Custom
        function getPreset(board) {
            return examPresets[board] || examPresets.Custom;
        }


        // Form refs
        const examBoardSelect = document.getElementById('exam-board');
        const examNameInput = document.getElementById('exam-name');
        const durationHoursInput = document.getElementById('duration-hours');
        const durationMinutesInput = document.getElementById('duration-minutes');
		const startTimeInput = document.getElementById('start-time');

        const btnMoreOptions = document.getElementById('btn-more-options');
        const moreOptionsContainer = document.getElementById('more-options-container');
        const enableReadingTimeCb = document.getElementById('enable-reading-time');
        const readingDurationInput = document.getElementById('reading-duration');
        const enableExtraTimeCb = document.getElementById('enable-extra-time');

        let editingTimerId = null;

        // Safely fetch custom inputs (if they exist in your HTML)
        const extraTimeTypeInput = document.getElementById('extra-time-type');
        const extraTimeValueInput = document.getElementById('extra-time-value');
        const customWarningTimesInput = document.getElementById('custom-warning-times');

        // Helpers
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function minutesToHM(totalMin) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `${h}h${pad(m)}m` : `${m}m`;
        }

        function timeStrToMinutes(str) {
            const parts = str.split(':').map(Number);
            const h = parts[0] || 0;
            const m = parts[1] || 0;
            const s = parts[2] || 0;
            return h * 60 + m + (s / 60);
        }

        function minutesToTimeStr(totalMin) {
            // Wrap into 00:00–23:59:59 so times before midnight / after 24:00 display correctly
            const totalSec = ((Math.round(totalMin * 60) % 86400) + 86400) % 86400;
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (s === 0) {
                return `${pad(h)}:${pad(m)}`;
            } else {
                return `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
        }

        function nowSeconds() {
            const now = new Date();
            return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        }

        // Shift the wall-clock second by ±24h so it sits within 12h of the exam's window.
        // This lets exams that cross midnight (or start just after it) keep counting correctly.
        function timerNowSec(timer, currentSec) {
            const first = timer.times[0].time * 60;
            const last = timer.times[timer.times.length - 1].time * 60;
            // Exams entirely within one day keep plain wall-clock behaviour
            if (first >= 0 && last <= 86400) return currentSec;
            const mid = (first + last) / 2;
            let s = currentSec;
            while (s - mid > 43200) s -= 86400;
            while (mid - s > 43200) s += 86400;
            return s;
        }

        function milestoneSec(t) {
            return Math.round(t.time * 60);
        }

        // Compute key times for a timer (Adapted for custom warnings & extra time)
        function computeTimes(board, startMin, durationMin, customWarnings = [], extraTimeSec = null, readingDurationMin = 0) {
            const times = [];
            const endMin = startMin + durationMin;

            if (readingDurationMin > 0) {
                times.push({ key: 'reading', label: 'READING', time: startMin - readingDurationMin });
            }
            
            times.push({ key: 'start', label: 'START', time: startMin });

            // Apply custom warnings dynamically without hard-coding default values
            if (customWarnings && customWarnings.length > 0) {
                customWarnings.forEach(w => {
                    const warnMin = parseInt(w);
                    if (!isNaN(warnMin) && warnMin > 0 && durationMin > warnMin) {
                        times.push({ key: `${warnMin}min`, label: `${warnMin} MIN`, time: endMin - warnMin });
                    }
                });
            }

            times.push({ key: 'end', label: '<span class="end-label-wrapper"><span>End</span><span class="badge-regular" style="display: none;">Regular time finished</span></span>', time: endMin });

            // Extra time comes from the timer's own setting (defaults live in examPresets)
            const extraMin = extraTimeSec ? Math.round(extraTimeSec / 60) : 0;

            if (extraMin > 0) {
                // Extra-time candidates run a parallel, longer exam: same start, duration + extra.
                // Their warnings count back from the extended end, e.g. 1h + 25% = 1h15m, so a
                // 30 min warning falls 45 min in (which may be before the regular end).
                const extraEndMin = endMin + extraMin;
                times.push({ key: 'extratime', label: 'EXTRA TIME', time: extraEndMin, isExtra: true });

                // Mirror every regular minute warning that was generated
                const generatedRegularWarnings = times
                    .filter(t => /^\d+min$/.test(t.key))
                    .map(t => parseInt(t.key.replace('min', '')));

                generatedRegularWarnings.forEach(w => {
                    times.push({
                        key: `extra-${w}min`,
                        label: `${w} MIN`,
                        time: extraEndMin - w,
                        isExtra: true,
                        isExtraWarning: true,
                        hiddenFromUI: true // Announced, but not listed on the card
                    });
                });
            }

            // Sort times chronologically
            times.sort((a, b) => a.time - b.time);

            return times;
        }
		
		function renderWarningCheckboxes(board, activeWarnings = null) {
            const container = document.getElementById('dynamic-warnings-container');
            container.innerHTML = '';
            
            const standardWarnings = [...(getPreset(board).warnings || [])];
            
            let allWarnings = [...standardWarnings];
            if (activeWarnings) {
                allWarnings = [...new Set([...allWarnings, ...activeWarnings])];
            }
            allWarnings.sort((a, b) => b - a);

            allWarnings.forEach(w => {
                const isStandard = standardWarnings.includes(w);
                const isChecked = activeWarnings ? activeWarnings.includes(w) : isStandard;
                
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.gap = '10px';
                div.style.width = '100%';
                div.innerHTML = `
                    <input type="checkbox" class="warning-checkbox" value="${w}" id="warning-${w}" ${isChecked ? 'checked' : ''}>
                    <label for="warning-${w}" style="margin-bottom: 0; font-weight: normal; white-space: nowrap; line-height: 1.3;">${w} min warning ${isStandard ? '' : '(Custom)'}</label>
                `;
                container.appendChild(div);
            });
        }

        function editTimer(timer) {
            editingTimerId = timer.id;
            examBoardSelect.value = timer.board;
            examBoardSelect.dispatchEvent(new Event('change')); 

            examNameInput.value = timer.name;
            durationHoursInput.value = Math.floor(timer.durationMin / 60);
            durationMinutesInput.value = timer.durationMin % 60;
            startTimeInput.value = minutesToTimeStr(timer.startMin);

            if (timer.readingDurationMin > 0) {
                enableReadingTimeCb.checked = true;
                readingDurationInput.disabled = false;
                readingDurationInput.value = timer.readingDurationMin;
            } else {
                enableReadingTimeCb.checked = false;
                readingDurationInput.disabled = true;
                readingDurationInput.value = 0;
            }

            // Existing custom warnings are already shown as checkboxes by renderWarningCheckboxes,
            // so the free-text field starts empty (otherwise unticking a box could never remove it)
            document.getElementById('custom-warnings-container').style.display = 'none';
            document.getElementById('btn-toggle-warnings').textContent = '+ Add extra warning';
            document.getElementById('custom-warning-times').value = '';

            if (timer.extraTimeSec > 0) {
                enableExtraTimeCb.checked = true;
                document.getElementById('extra-time-value').disabled = false;
                document.getElementById('extra-time-type').disabled = false;

                // Older save files don't store the type/value: recognise the board's default %
                const presetPct = getPreset(timer.board).extraPct;
                const expectedPercentageSec = (timer.durationMin * 60) * (presetPct / 100);
                if (timer.extraTimeType && timer.extraTimeValue !== undefined) {
                    document.getElementById('extra-time-type').value = timer.extraTimeType;
                    document.getElementById('extra-time-value').value = timer.extraTimeValue;
                } else if (presetPct > 0 && timer.extraTimeSec === expectedPercentageSec) {
                    document.getElementById('extra-time-type').value = 'percentage';
                    document.getElementById('extra-time-value').value = presetPct;
                } else {
                    document.getElementById('extra-time-type').value = 'absolute';
                    document.getElementById('extra-time-value').value = Math.round(timer.extraTimeSec / 60);
                }
            } else {
                enableExtraTimeCb.checked = false;
                document.getElementById('extra-time-value').disabled = true;
                document.getElementById('extra-time-type').disabled = true;
            }

            document.getElementById('btn-start').textContent = 'Update Timer';
            btnCancel.style.display = 'block';
            moreOptionsContainer.style.display = 'block';
            btnMoreOptions.innerHTML = 'More options <span style="font-size: 0.7em;">▲</span>';
            setupOverlay.classList.remove('hidden');
        }

        // Show setup form
        function showSetup() {
            editingTimerId = null;
            document.getElementById('btn-start').textContent = 'Add Timer';
            moreOptionsContainer.style.display = 'none';
            btnMoreOptions.innerHTML = 'More options <span style="font-size: 0.7em;">▼</span>';
            
            examNameInput.value = '';
            const now = new Date();
            startTimeInput.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            examBoardSelect.value = 'Custom';
            // Apply the Custom preset (duration, warnings, reading & extra time);
            // otherwise the form keeps the settings of the last timer added or edited
            examBoardSelect.dispatchEvent(new Event('change'));

            if (customWarningTimesInput) customWarningTimesInput.value = '';

            const warningsContainer = document.getElementById('custom-warnings-container');
            const warningsBtn = document.getElementById('btn-toggle-warnings');
            if (warningsContainer) warningsContainer.style.display = 'none';
            if (warningsBtn) warningsBtn.textContent = '+ Add extra warning';

            btnCancel.style.display = timers.length > 0 ? 'block' : 'none';
            setupOverlay.classList.remove('hidden');
        }

        // Build a card DOM element for a timer
        function buildCard(timer) {
            const card = document.createElement('div');
            
            // Attach the exact geometry observer to this card
            bannerObserver.observe(card);
            
            const preset = getPreset(timer.board);
            const boardClass = preset.type; // colour theme: ib / igcse / maths / custom
            
            card.className = `exam-card ${boardClass}`;
            card.dataset.timerId = timer.id;
            card.draggable = true;

            card.addEventListener('mousedown', (e) => {
                // Also disable dragging when grabbing the bottom-right resize grip,
                // otherwise the browser starts a card drag instead of resizing
                const rect = card.getBoundingClientRect();
                const onResizeGrip = e.clientX > rect.right - 20 && e.clientY > rect.bottom - 20;
                if (onResizeGrip || e.target.closest('button, input')) {
                    card.draggable = false;
                }
            });

            const removeBtn = document.createElement('button');
            removeBtn.className = 'card-remove';
            removeBtn.textContent = '\u00d7';
            removeBtn.setAttribute('aria-label', `Remove timer: ${timer.name}`);
            removeBtn.title = 'Remove timer';
            removeBtn.addEventListener('click', () => removeTimer(timer.id));
            card.appendChild(removeBtn);

            const editBtn = document.createElement('button');
            editBtn.className = 'card-edit';
            editBtn.innerHTML = '&#9998;';
            editBtn.setAttribute('aria-label', `Edit timer: ${timer.name}`);
            editBtn.title = 'Edit timer';
            editBtn.addEventListener('click', () => editTimer(timer));
            card.appendChild(editBtn);

            // Create the new inner wrapper to separate Flexbox resizing from Container Queries
            const innerWrapper = document.createElement('div');
            innerWrapper.className = 'exam-card-inner';

            const boardLabel = document.createElement('div');
            boardLabel.className = 'exam-board-label';
            timer.boardLabel = timer.customBoardName || preset.label;
            boardLabel.textContent = timer.boardLabel;
            innerWrapper.appendChild(boardLabel);

            const nameLabel = document.createElement('div');
            nameLabel.className = 'exam-name';
            nameLabel.textContent = timer.name;
            innerWrapper.appendChild(nameLabel);

            const durLabel = document.createElement('div');
            durLabel.className = 'exam-duration-label';
            durLabel.textContent = minutesToHM(timer.durationMin);
            innerWrapper.appendChild(durLabel);

            const rowsContainer = document.createElement('div');
			rowsContainer.className = 'time-rows';

			function renderRows() {
				rowsContainer.innerHTML = '';
				timer.times.forEach(t => {
					if (t.key === 'reading' || t.key === 'start') {
						const row = document.createElement('div');
						row.className = 'start-edit-row';
						row.dataset.key = t.key;

						row.innerHTML = `
							<div class="label" style="display:flex; align-items:center;">
								${t.label}
							</div>
							<input type="text" class="start-edit-input" value="${minutesToTimeStr(t.time)}" pattern="([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?" lang="en-GB">
						`;
						rowsContainer.appendChild(row);

						const input = row.querySelector('.start-edit-input');
						input.addEventListener('change', (e) => {
							if (input.checkValidity()) {
								const newTime = timeStrToMinutes(e.target.value);
								if (t.key === 'reading') {
									timer.startMin = newTime + timer.readingDurationMin;
								} else {
									timer.startMin = newTime;
								}
								timer.times = computeTimes(timer.board, timer.startMin, timer.durationMin, timer.customWarnings, timer.extraTimeSec, timer.readingDurationMin);
								refreshCardRows(timer);
							} else {
								input.value = minutesToTimeStr(t.time);
							}
						});
					} else {
                        // Extra-time warnings are announced but not listed; only the extra-time end is shown
                        if (t.hiddenFromUI) return;

						const row = document.createElement('div');
						row.className = 'time-row';
						row.dataset.key = t.key;
                        row.innerHTML = `
                            <span class="label">${t.label}</span>
                            <span class="value">${minutesToTimeStr(t.time)}</span>
                        `;
						rowsContainer.appendChild(row);
					}
				});
			}
			
			timer.renderRows = renderRows;
			renderRows();

			innerWrapper.appendChild(rowsContainer);

            const countdownSection = document.createElement('div');
            countdownSection.className = 'countdown-section';
            countdownSection.innerHTML = `
                <div class="exam-finished-banner" id="banner-${timer.id}">
                    <div class="exam-finished-frame">
                        <div class="exam-finished-text">EXAM HAS FINISHED</div>
                    </div>
                </div>
                <div class="countdown-status"></div>
                <div class="countdown-time">--:--</div>
            `;
            innerWrapper.appendChild(countdownSection);
            
            // Append the entire wrapper to the main card
            card.appendChild(innerWrapper);

            timer.el = card;
            return card;
        }

        function refreshCardRows(timer) {
            if (timer.renderRows) {
                timer.renderRows();
            }
        }

        function addTimer(data) {
            if (timers.length >= MAX_TIMERS) {
                alert('Maximum of ' + MAX_TIMERS + ' timers reached.');
                return;
            }

            const timer = {
                id: nextId++,
                board: data.board,
                name: data.name,
                durationMin: data.durationMin,
                startMin: data.startMin,
                customBoardName: data.customBoardName,
                customWarnings: data.customWarnings,
                extraTimeSec: data.extraTimeSec,
                extraTimeType: data.extraTimeType,
                extraTimeValue: data.extraTimeValue,
                readingDurationMin: data.readingDurationMin || 0,
                times: computeTimes(data.board, data.startMin, data.durationMin, data.customWarnings, data.extraTimeSec, data.readingDurationMin || 0),
                el: null
            };

            timers.push(timer);
            const card = buildCard(timer);

            cardsGrid.appendChild(card);
            setupOverlay.classList.add('hidden');
            timerView.classList.add('active');

            if (!tickInterval) {
                tick();
                scheduleTick();
            }

            if (timers.length === 1) {
                showToast();
            }
        }

        function showToast() {
            document.getElementById('toast').classList.add('visible');
            document.getElementById('toast-backdrop').classList.add('visible');
        }

        function hideToast() {
            document.getElementById('toast').classList.remove('visible');
            document.getElementById('toast-backdrop').classList.remove('visible');
        }

        function removeTimer(id) {
            const idx = timers.findIndex(t => t.id === id);
            if (idx === -1) return;
            const timer = timers[idx];
            bannerObserver.unobserve(timer.el);
            timer.el.remove();
            timers.splice(idx, 1);

            if (timers.length === 0) {
                clearTimeout(tickInterval);
                tickInterval = null;
                timerView.classList.remove('active');
                showSetup();
            }
        }

        // Fire just after each wall-clock second boundary (instead of a drifting setInterval),
        // so the displayed second never skips or repeats
        function scheduleTick() {
            tickInterval = setTimeout(() => {
                tick();
                scheduleTick();
            }, 1000 - (Date.now() % 1000) + 5);
        }

        function tick() {
            const now = new Date();
            document.getElementById('current-time').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            // --- NEW DATE LOGIC ---
            const dateEl = document.getElementById('current-date');
            if (dateEl) {
                const day = now.getDate();
                const monthName = now.toLocaleString('en-GB', { month: 'long' });
                const year = now.getFullYear();
                
                const dd = String(day).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                
                let suffix = 'th';
                if (day % 10 === 1 && day !== 11) suffix = 'st';
                else if (day % 10 === 2 && day !== 12) suffix = 'nd';
                else if (day % 10 === 3 && day !== 13) suffix = 'rd';
                
                dateEl.textContent = `${day}${suffix} of ${monthName} ${year}   |   ${dd}/${mm}/${year}`;
            }

            const wallSec = nowSeconds();

            // Calculate global next announcement across all timers
            // (compared by seconds-until, so timers on either side of midnight rank correctly)
            let nextGlobalMilestoneTime = null;
            let nextGlobalDelta = null;
            let nextEntries = []; // every { timer, t } due at the next announcement moment

            timers.forEach(timer => {
                const currentSec = timerNowSec(timer, wallSec);
                // Queue all upcoming announcements: warnings, end, and extratime (ignore start/reading)
                const upcoming = timer.times.filter(t => currentSec < milestoneSec(t) && t.key !== 'start' && t.key !== 'reading');

                if (upcoming.length > 0) {
                    const nextSec = milestoneSec(upcoming[0]);
                    const delta = nextSec - currentSec;
                    const due = upcoming.filter(t => milestoneSec(t) === nextSec).map(t => ({ timer, t }));

                    if (nextGlobalDelta === null || delta < nextGlobalDelta) {
                        nextGlobalDelta = delta;
                        nextGlobalMilestoneTime = upcoming[0].time;
                        nextEntries = due;
                    } else if (delta === nextGlobalDelta) {
                        nextEntries.push(...due);
                    }
                }
            });

            const uniqueTimers = entries => [...new Set(entries.map(e => e.timer))];
            const regularEntries = nextEntries.filter(e => !e.t.isExtra);
            const extraEntries = nextEntries.filter(e => e.t.isExtra);
            const regularTimers = uniqueTimers(regularEntries);
            const extraTimers = uniqueTimers(extraEntries);
            const isExtraOnly = regularEntries.length === 0 && extraEntries.length > 0;
            const isSimultaneous = regularEntries.length > 0 && extraEntries.length > 0;

            let headerLabel = 'NEXT ANNOUNCEMENT';
            if (isExtraOnly) {
                if (extraEntries.every(e => e.t.isExtraWarning)) headerLabel = 'EXTRA TIME WARNING';
                else if (extraEntries.every(e => !e.t.isExtraWarning)) headerLabel = 'EXTRA TIME END';
                else headerLabel = 'EXTRA TIME';
            }

            // Lighter-hue highlight when the next announcement is only for extra-time candidates
            document.querySelectorAll('.next-announcement-block').forEach(block => {
                block.classList.toggle('is-extra-warning', isExtraOnly);
                const labelEl = block.querySelector('.announcement-label');
                if (labelEl) labelEl.textContent = headerLabel;
            });

            // Who the announcement is for:
            //  - regular + extra at the same moment → "Regular: <board>" / "Extra: <board>" ("Multiple" if >1)
            //  - otherwise, with several exams on screen → the exam name(s)
            const who = list => list.length > 1 ? 'Multiple' : list[0].boardLabel;
            document.querySelectorAll('.announcement-exam').forEach(el => {
                el.replaceChildren();
                if (isSimultaneous) {
                    const reg = document.createElement('div');
                    reg.textContent = `Regular: ${who(regularTimers)}`;
                    const ext = document.createElement('div');
                    ext.className = 'announcement-exam-extra';
                    ext.textContent = `Extra: ${who(extraTimers)}`;
                    el.append(reg, ext);
                    el.title = `${reg.textContent}\n${ext.textContent}`;
                } else if (timers.length > 1 && nextEntries.length > 0) {
                    const names = uniqueTimers(nextEntries).map(t => t.name).join(', ');
                    el.textContent = names;
                    el.title = names;
                } else {
                    el.title = '';
                }
            });

            const announcementTimeEls = document.querySelectorAll('.announcement-time');
            announcementTimeEls.forEach(el => {
                if (nextGlobalMilestoneTime !== null) {
                    el.textContent = minutesToTimeStr(nextGlobalMilestoneTime);
                } else {
                    el.textContent = `---`;
                }
            });

            timers.forEach(timer => {
                const highlightClass = 'highlighted-' + getPreset(timer.board).type;

                const rowsContainer = timer.el.querySelector('.time-rows');
                const rows = rowsContainer.children;

                const currentSec = timerNowSec(timer, wallSec);

                // A milestone is "active" for the 60 seconds starting at its exact time
                // (works for start times / durations that aren't on a whole minute)
                let currentIdx = -1;
                let activeMilestones = [];
                timer.times.forEach((t, i) => {
                    const tSec = milestoneSec(t);
                    if (currentSec >= tSec) currentIdx = i;
                    if (currentSec >= tSec && currentSec < tSec + 60) activeMilestones.push(t);
                });

                const statusEl = timer.el.querySelector('.countdown-status');
                const countdownEl = timer.el.querySelector('.countdown-time');
				const bannerEl = timer.el.querySelector('.exam-finished-banner');

                const endTime = timer.times.find(t => t.key === 'end');
                const startTime = timer.times.find(t => t.key === 'start');
                const readingTime = timer.times.find(t => t.key === 'reading');
                const extraTime = timer.times.find(t => t.key === 'extratime');

                const endSec = milestoneSec(endTime);
                const startSec = milestoneSec(startTime);
                const readingSec = readingTime ? milestoneSec(readingTime) : null;
                const finalSec = extraTime ? milestoneSec(extraTime) : endSec;

                // Handle the "Regular time finished" badge visibility
                const endRow = timer.el.querySelector('.time-row[data-key="end"]');
                if (endRow) {
                    const badge = endRow.querySelector('.badge-regular');
                    if (badge) {
                        badge.style.display = currentSec >= endSec ? 'inline-block' : 'none';
                    }
                }

                // Cleanup all highlights
                Array.from(rows).forEach(row => {
                    row.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-maths', 'highlighted-custom');
                    const label = row.querySelector('.label');
                    if (label) label.classList.remove('active-extra-warning', 'active-extra-indicator');
                });
                countdownEl.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-maths', 'highlighted-custom');

                // Apply highlights based on active milestones
                if (activeMilestones.length > 0) {
                    // Rows listed on the card (incl. the EXTRA TIME end) get the full-row highlight
                    const rowMilestones = activeMilestones.filter(t => !t.hiddenFromUI);
                    const extraWarnings = activeMilestones.filter(t => t.isExtraWarning);

                    rowMilestones.forEach(m => {
                        const regRow = timer.el.querySelector(`[data-key="${m.key}"]`);
                        if (regRow) regRow.classList.add(highlightClass);
                    });

                    // Unlisted extra-time warnings: lighter-hue chip on the matching warning label
                    // plus the EXTRA TIME label, so the card shows who the announcement is for
                    extraWarnings.forEach(m => {
                        const matchingRow = timer.el.querySelector(`[data-key="${m.key.replace('extra-', '')}"]`);
                        const label = matchingRow && matchingRow.querySelector('.label');
                        if (label) label.classList.add('active-extra-warning');
                    });
                    if (extraWarnings.length > 0) {
                        const extraLabel = timer.el.querySelector('[data-key="extratime"] .label');
                        if (extraLabel) extraLabel.classList.add('active-extra-indicator');
                    }
                } else if (currentIdx >= 0 && currentSec < finalSec) {
                    countdownEl.classList.add(highlightClass);
                }

                // Hide banner by default for all active states
                if (bannerEl) bannerEl.style.display = 'none';

                if (currentSec >= finalSec) {
                    statusEl.textContent = 'Exam Finished';
                    countdownEl.textContent = '00:00:00';
                    if (bannerEl) bannerEl.style.display = 'flex'; // SHOW BANNER
                } else if (currentSec >= endSec) {
                    statusEl.textContent = 'Extra Time';
                    const rem = finalSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (currentSec >= startSec) {
                    statusEl.textContent = 'Time Remaining';
                    const rem = endSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (readingSec !== null && currentSec >= readingSec) {
                    statusEl.textContent = 'Reading Time';
                    const rem = startSec - currentSec;
                    const rm = Math.floor(rem / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = `${pad(rm)}:${pad(rs)}`;
                } else {
                    const waitTarget = readingSec !== null ? readingSec : startSec;
                    statusEl.textContent = 'Waiting to Start';
                    const rem = waitTarget - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                }
            });
        }

        // --- Event listeners ---
		
		// UI interactions for new checkboxes and toggles
        const btnToggleWarnings = document.getElementById('btn-toggle-warnings');
        const customWarningsContainer = document.getElementById('custom-warnings-container');
        
        btnMoreOptions.addEventListener('click', () => {
            const isHidden = moreOptionsContainer.style.display === 'none';
            moreOptionsContainer.style.display = isHidden ? 'block' : 'none';
            btnMoreOptions.innerHTML = isHidden ? 'More options <span style="font-size: 0.7em;">▲</span>' : 'More options <span style="font-size: 0.7em;">▼</span>';
        });
        
        enableReadingTimeCb.addEventListener('change', (e) => {
            readingDurationInput.disabled = !e.target.checked;
        });
        
        enableExtraTimeCb.addEventListener('change', (e) => {
            document.getElementById('extra-time-value').disabled = !e.target.checked;
            document.getElementById('extra-time-type').disabled = !e.target.checked;
        });

        btnToggleWarnings.addEventListener('click', () => {
            if (customWarningsContainer.style.display === 'none') {
                customWarningsContainer.style.display = 'block';
                btnToggleWarnings.textContent = '- Hide extra warning';
            } else {
                customWarningsContainer.style.display = 'none';
                btnToggleWarnings.textContent = '+ Add extra warning';
                if (customWarningTimesInput) customWarningTimesInput.value = '';
            }
        });

        // Start timer
        document.getElementById('btn-start').addEventListener('click', () => {
            const board = examBoardSelect.value;
            const name = examNameInput.value.trim() || 'Unnamed Exam';
            const hours = parseInt(durationHoursInput.value) || 0;
            const minutes = parseInt(durationMinutesInput.value) || 0;
            const durationMin = hours * 60 + minutes;

            if (durationMin <= 0) {
                alert('Please enter a valid duration.');
                return;
            }

            // Capture the reading duration from checkbox state
            const readingDurationMin = enableReadingTimeCb.checked ? (parseFloat(document.getElementById('reading-duration').value) || 0) : 0;

            if (!/^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$/.test(startTimeInput.value)) {
                alert('Please enter a valid start time (24-hour, HH:MM or HH:MM:SS, 00:00 to 23:59:59).');
                return;
            }
            const startMin = timeStrToMinutes(startTimeInput.value);

            // Custom board name only applies to Custom boards: keep it when editing a Custom timer,
            // ask for one when a timer becomes Custom, and drop it when switching to a named board
            let customBoardName = null;
            if (board === 'Custom') {
                const existing = editingTimerId ? timers.find(t => t.id === editingTimerId) : null;
                if (existing && existing.board === 'Custom' && existing.customBoardName) {
                    customBoardName = existing.customBoardName;
                } else {
                    customBoardName = prompt('Enter custom board name:', 'Custom Board') || 'Custom';
                }
            }

            // Resolve Custom Warnings from dynamic checkboxes and input
            let customWarnings = [];
            document.querySelectorAll('.warning-checkbox:checked').forEach(cb => {
                customWarnings.push(parseInt(cb.value));
            });
            
            if (typeof customWarningTimesInput !== 'undefined' && customWarningTimesInput && customWarningTimesInput.value.trim() !== '') {
                const extraInputs = customWarningTimesInput.value.split(',')
                    .map(s => parseInt(s.trim()))
                    .filter(n => !isNaN(n) && n > 0);
                customWarnings.push(...extraInputs);
            }

            // Sort and deduplicate warnings
            customWarnings = [...new Set(customWarnings)].sort((a, b) => b - a);

            // Resolve Extra Time from checkbox state
            let extraTimeSec = null;
            let extraTimeType = null;
            let extraTimeValue = null;
            if (enableExtraTimeCb.checked && typeof extraTimeTypeInput !== 'undefined' && extraTimeTypeInput && extraTimeValueInput) {
                extraTimeType = extraTimeTypeInput.value;
                extraTimeValue = parseFloat(extraTimeValueInput.value) || 0;

                if (extraTimeType === 'percentage') {
                    extraTimeSec = (durationMin * 60) * (extraTimeValue / 100);
                } else if (extraTimeType === 'absolute') {
                    extraTimeSec = extraTimeValue * 60;
                }
            } else {
                extraTimeSec = 0;
            }

            const data = { board, name, durationMin, startMin, customBoardName, customWarnings, extraTimeSec, extraTimeType, extraTimeValue, readingDurationMin };

            if (editingTimerId) {
                const idx = timers.findIndex(t => t.id === editingTimerId);
                if (idx !== -1) {
                    const t = timers[idx];
                    t.board = data.board;
                    t.name = data.name;
                    t.durationMin = data.durationMin;
                    t.startMin = data.startMin;
                    t.customBoardName = data.customBoardName;
                    t.customWarnings = data.customWarnings;
                    t.extraTimeSec = data.extraTimeSec;
                    t.extraTimeType = data.extraTimeType;
                    t.extraTimeValue = data.extraTimeValue;
                    t.readingDurationMin = data.readingDurationMin;
                    t.times = computeTimes(t.board, t.startMin, t.durationMin, t.customWarnings, t.extraTimeSec, t.readingDurationMin);

                    bannerObserver.unobserve(t.el);
                    t.el.remove();
                    const newCard = buildCard(t);
                    const refNode = cardsGrid.children[idx] || null;
                    cardsGrid.insertBefore(newCard, refNode);
                }
                setupOverlay.classList.add('hidden');
                editingTimerId = null; // Clear the edit state instead of reopening
            } else {
                addTimer(data);
            }
        });

        btnCancel.addEventListener('click', () => {
            setupOverlay.classList.add('hidden');
        });

		// Auto-fill durations and extra time based on exam selection
        examBoardSelect.addEventListener('change', (e) => {
            const board = e.target.value;
            const preset = getPreset(board);

            // Reading time
            enableReadingTimeCb.checked = preset.readingMin > 0;
            readingDurationInput.disabled = !(preset.readingMin > 0);
            readingDurationInput.value = String(preset.readingMin || 0);

            // Extra time (when off, the field still shows the Custom % ready to switch on)
            const extraOn = preset.extraPct > 0;
            enableExtraTimeCb.checked = extraOn;
            extraTimeTypeInput.value = 'percentage';
            extraTimeValueInput.value = String(preset.extraPct || examPresets.Custom.extraPct);
            extraTimeTypeInput.disabled = !extraOn;
            extraTimeValueInput.disabled = !extraOn;

            // Warning checkboxes (when editing, keep that timer's own warnings ticked)
            renderWarningCheckboxes(board, editingTimerId ? timers.find(t => t.id === editingTimerId).customWarnings : null);

            // Duration
            const totalMins = preset.durationMin;

            // Apply the calculated duration to the input boxes
            if (totalMins > 0) {
                durationHoursInput.value = Math.floor(totalMins / 60);
                durationMinutesInput.value = totalMins % 60;
            }
        });

        // Load button
        document.getElementById('btn-load').addEventListener('click', () => {
            if (timers.length > 0 && !confirm('Loading a file will replace all current timers. Continue?')) return;
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    let data = JSON.parse(evt.target.result);
                    if (!Array.isArray(data)) data = [data];

                    const valid = data.filter(d => d && typeof d.board === 'string' && d.name &&
                        typeof d.durationMin === 'number' && d.durationMin > 0 && typeof d.startMin === 'number');

                    if (valid.length === 0) {
                        // Leave any current timers untouched
                        alert('No valid timers found in file.');
                        return;
                    }

                    timers.forEach(t => { bannerObserver.unobserve(t.el); t.el.remove(); });
                    timers.length = 0;

                    valid.forEach(d => {
                        // Older save files didn't store reading time: fall back to the board's preset
                        if (typeof d.readingDurationMin !== 'number') {
                            d.readingDurationMin = getPreset(d.board).readingMin;
                        }
                        addTimer(d);
                    });
                } catch {
                    alert('Could not read timer file.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // Download button
        document.getElementById('btn-download').addEventListener('click', () => {
            if (timers.length === 0) return;
            const saveData = timers.map(t => ({
                board: t.board,
                name: t.name,
                durationMin: t.durationMin,
                startMin: t.startMin,
                customBoardName: t.customBoardName,
                customWarnings: t.customWarnings,
                extraTimeSec: t.extraTimeSec,
                extraTimeType: t.extraTimeType,
                extraTimeValue: t.extraTimeValue,
                readingDurationMin: t.readingDurationMin
            }));
            const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timer.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- Drag and drop reordering ---
        let draggedCard = null;

        // Re-enable dragging on release anywhere (a resize can end outside the card)
        document.addEventListener('mouseup', () => {
            cardsGrid.querySelectorAll('.exam-card').forEach(c => { c.draggable = true; });
        });

        cardsGrid.addEventListener('dragstart', (e) => {
            const card = e.target.closest('.exam-card');
            if (!card) { e.preventDefault(); return; }
            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        cardsGrid.addEventListener('dragend', (e) => {
            if (draggedCard) {
                draggedCard.classList.remove('dragging');
                draggedCard = null;
            }
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        cardsGrid.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.exam-card');
            if (!target || target === draggedCard) return;
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            target.classList.add('drag-over');
        });

        cardsGrid.addEventListener('dragleave', (e) => {
            const target = e.target.closest('.exam-card');
            if (target) target.classList.remove('drag-over');
        });

        cardsGrid.addEventListener('drop', (e) => {
            e.preventDefault();
            const target = e.target.closest('.exam-card');
            if (!target || !draggedCard || target === draggedCard) return;
            target.classList.remove('drag-over');

            const allCards = [...cardsGrid.querySelectorAll('.exam-card')];
            const dragIdx = allCards.indexOf(draggedCard);
            const dropIdx = allCards.indexOf(target);

            if (dragIdx < dropIdx) {
                cardsGrid.insertBefore(draggedCard, target.nextSibling);
            } else {
                cardsGrid.insertBefore(draggedCard, target);
            }

            const newOrder = [...cardsGrid.querySelectorAll('.exam-card')].map(
                el => timers.find(t => t.id === Number(el.dataset.timerId))
            ).filter(Boolean);
            timers.length = 0;
            timers.push(...newOrder);
        });

        document.getElementById('toast-dismiss').addEventListener('click', hideToast);
        document.getElementById('toast-backdrop').addEventListener('click', hideToast);

        // Force the presets to load based on the default selected dropdown option
        examBoardSelect.dispatchEvent(new Event('change'));

        showSetup();
    </script>
</body>
</html>
