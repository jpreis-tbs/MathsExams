<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths exams</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='24' viewBox='0 0 24 24' width='24'%3E%3Cpath fill='%23ffffff' d='M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }

        /* Setup overlay */
        #setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #setup-overlay.hidden {
            display: none;
        }

        .setup-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-height: 90vh; /* Constrains the window to 90% of the screen height */
            overflow-y: auto; /* Adds a scrollbar only when the content gets too long */
        }

        .setup-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1.05rem;
            color: #000;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #555;
        }

        .duration-row {
            display: flex;
            gap: 10px;
        }

        .duration-row input {
            flex: 1;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }

        .btn-link {
            background: none;
            color: #555;
            font-size: 0.95rem;
            text-decoration: underline;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            border: none;
            margin-top: 4px;
        }

        .btn-link:hover {
            color: #000;
        }

        .setup-cancel {
            background: none;
            color: #999;
            font-size: 0.9rem;
            text-decoration: underline;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            border: none;
            margin-top: 2px;
            display: none;
        }

        .setup-cancel:hover {
            color: #000;
        }

        /* Timer view */
        #timer-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 0 40px 80px;
            flex-direction: column;
            align-items: center;
        }

        #timer-view.active {
            display: flex;
        }

        /* Fixed Sticky Header */
        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            /* Added 15px left/right padding so the scrollbar doesn't overlap the right button */
            padding: 15px 15px; 
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 36px;
            position: sticky;
            top: 0;
            z-index: 100;
            
            /* --- NEW PROPERTIES FOR RESIZING & SCROLLING --- */
            resize: vertical;      /* Allows the user to drag the bottom edge to resize */
            overflow-y: auto;      /* Introduces a scrollbar if the header gets too small for its content */
            min-height: 90px;      /* Prevents the user from crushing it so small the buttons break */
            max-height: 60vh;      /* Prevents dragging the header past 60% of the screen height */
        }
        
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* New Add Timer buttons restricted to header size */
        .header-add-btn {
            height: 50px;
            padding: 0 24px;
            background-color: #000;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .header-add-btn:hover {
            opacity: 0.85;
        }

        .header-add-btn:active {
            transform: translateY(2px);
        }

        .current-time-label {
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 4px;
        }

        .current-time {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
		#next-announcement {
            font-size: 1.1rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            font-weight: 500;
            margin-top: -5px; 
            margin-bottom: 15px;
        }

        /* Card grid */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 24px;
            width: 100%;
        }

        .exam-card {
            border: 4px solid;
            border-radius: 14px;
            padding: 28px 32px;
            position: relative;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.2s, opacity 0.2s;
            overflow: hidden;
            
            /* Flexbox sizing and resizing */
            flex: 0 1 auto;             /* Changed flex-grow to 0 so it respects manual resizing */
            width: calc(25% - 24px);    /* Sets a base width of 4 columns */
            min-width: 280px;           
            min-height: 250px;
            max-width: 100%;
            resize: both; /* Both horizontal and vertical resizing will now work */
        }

        /* New inner wrapper to handle container queries without breaking resize */
        .exam-card-inner {
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .exam-card.dragging {
            opacity: 0.4;
            box-shadow: none;
        }

        .exam-card.drag-over { 
		opacity: 0.4 !important;
		border: 2px dashed #4b5563 !important; 
		transform: scale(0.98);
}

        .exam-card:active {
            cursor: grabbing;
        }

        .exam-card.ib {
            border-color: #1a56db;
        }

        .exam-card.igcse {
            border-color: #dc2626;
        }

        .exam-card.maths {
            border-color: #FFDA03;
        }

		.exam-card.custom {
			border-color: #000000;
		}

        .card-remove {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .card-remove:hover {
            color: #666;
        }

        .exam-name {
            font-size: 3.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
            line-height: 1.1; /* Fixes vertical text alignment / cropping */
            padding: 0 20px; /* Prevents long titles from hitting the 'X' button */
            word-wrap: break-word;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .exam-board-label {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .exam-card.ib .exam-board-label {
            color: #1a56db;
        }

        .exam-card.igcse .exam-board-label {
            color: #dc2626;
        }

        .exam-card.maths .exam-board-label {
            color: #FFDA03;
        }
		
		.exam-card.custom .exam-board-label {
            color: #000000;
        }

        .exam-duration-label {
            font-size: 1.1rem;
            color: #777;
            text-align: center;
            margin-bottom: 10px;
        }

        .time-rows {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .time-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .time-row .value {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* --- Robust CSS Variable Theme Engine --- */
        .exam-card {
            --card-base-bg: #ffffff; /* The default background color of the card */
        }
        
        /* Define the exact theme color for each board */
        .exam-card.ib { --board-theme-color: #1a56db; --board-theme-muted: #9eb6ef; }
        .exam-card.igcse { --board-theme-color: #dc2626; --board-theme-muted: #f1a5a5; }
        .exam-card.maths { --board-theme-color: #FFDA03; --board-theme-muted: #ffe866; }
        .exam-card.custom { --board-theme-color: #000000; --board-theme-muted: #999999; }

        /* Extra Time Badge Styling */
        .extra-badge {
            margin-left: 8px;
            font-size: 0.85em;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
        }

        /* Targeted styling for Extra Time Row components */
        .time-row[data-key="extratime"].active-extra-primary .label,
        .time-row[data-key="extratime"].active-extra-secondary .label {
            background-color: transparent !important;
            color: inherit !important;
            display: inline-flex;
            align-items: center;
        }

        .time-row[data-key="extratime"].active-extra-primary .extra-label-text,
        .time-row[data-key="extratime"].active-extra-secondary .extra-label-text {
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: -6px;
        }

        /* Primary active state (no conflict) */
        .time-row[data-key="extratime"].active-extra-primary .extra-label-text,
        .time-row[data-key="extratime"].active-extra-primary .extra-badge {
            background-color: var(--board-theme-color) !important;
            color: var(--card-base-bg) !important;
        }
        
        /* Exception: Maths primary text color */
        .exam-card.maths .time-row[data-key="extratime"].active-extra-primary .extra-label-text,
        .exam-card.maths .time-row[data-key="extratime"].active-extra-primary .extra-badge {
            color: #000 !important;
        }

        /* Secondary active state (conflict resolution) */
        .time-row[data-key="extratime"].active-extra-secondary .extra-label-text,
        .time-row[data-key="extratime"].active-extra-secondary .extra-badge {
            background-color: var(--board-theme-muted) !important;
            color: #000 !important; /* High contrast against muted backgrounds */
        }

        /* Unified Time Row Highlights (For ALL boards EXCEPT Maths) */
        #cards-grid .exam-card:not(.maths) .time-row .label[class*="highlighted-"],
        #cards-grid .exam-card:not(.maths) .start-edit-row .label[class*="highlighted-"] {
            background-color: var(--board-theme-color) !important;
            color: var(--card-base-bg) !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }

        /* Maths Exception: Warning row highlight stays Yellow Background, Black Font */
        #cards-grid .exam-card.maths .time-row .label.highlighted-maths,
        #cards-grid .exam-card.maths .start-edit-row .label.highlighted-maths {
            background-color: #FFDA03 !important;
            color: #000000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }
        
        /* Extra Time Warning Shrink-Wrap Highlights (Distinct Hue / Muted Tone) */
        .exam-card.ib .time-row .label.active-extra-warning,
        .exam-card.ib .time-row .label.active-extra-indicator {
            background-color: #9eb6ef !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }
        .exam-card.igcse .time-row .label.active-extra-warning,
        .exam-card.igcse .time-row .label.active-extra-indicator {
            background-color: #f1a5a5 !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }
        .exam-card.maths .time-row .label.active-extra-warning,
        .exam-card.maths .time-row .label.active-extra-indicator {
            background-color: #ffe866 !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }
        .exam-card.custom .time-row .label.active-extra-warning,
        .exam-card.custom .time-row .label.active-extra-indicator {
            background-color: #999999 !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: -8px;
        }

        .countdown-section {
            margin-top: auto;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
            /* Removed position: relative; so the banner anchors to the main card boundaries instead */
        }

        /* --- Exam Finished Banner --- */
        .exam-finished-banner {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none; /* Hidden until timer hits 0, switched to flex in JS */
            
            /* Uses the exact mathematical polygon calculated by JS, with a fallback */
            clip-path: var(--banner-clip, polygon(0% 80%, 20% 100%, 100% 20%, 80% 0%));
            
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: #fff;
            background: #dc2626; /* Ensure you have a background color so the shape is visible! */
            container-type: size; 
        }

        /* --- The Decorative Inset Frame --- */
        .exam-finished-frame {
            position: absolute;
            /* Insets the frame by 12px total relative to geometric bounds */
            width: calc(var(--banner-length) - 12px);
            height: calc(var(--banner-thickness) - 12px);
            transform: rotate(var(--banner-angle, 0rad));
            
            /* currentColor preserves your theme colors (e.g., black for Maths) */
            border: 2px solid currentColor; 
            border-radius: 4px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .exam-finished-text {
            /* Forces the text container to exactly match the length of segment UV */
            width: var(--uv-length);
            
            /* Dynamically sizes the font based on the UV length, capped against vertical overflow */
            font-size: min(calc(var(--uv-length) * 0.075), calc(var(--banner-thickness) * 0.45)); 
            
            /* Centers the string perfectly inside the UV segment */
            text-align: center;
            
            color: inherit; 
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
            
            /* The frame handles the rotation, so text stays flat inside */
            transform: none; 
        }

        .exam-card.ib .exam-finished-banner { background-color: #1a56db; }
        .exam-card.igcse .exam-finished-banner { background-color: #dc2626; }
        .exam-card.custom .exam-finished-banner { background-color: #000; }
        .exam-card.maths .exam-finished-banner { 
            background-color: #FFDA03; 
            color: #000; 
            border-color: #000; 
        }

        /* --- Regular Time Badge --- */
        .end-label-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .badge-regular {
            display: inline-block;
            background-color: #888;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            /* Dynamically scales down font size if the card gets too narrow */
            font-size: min(0.75rem, 3.5cqi); 
            margin-left: 0; /* Align left edge cleanly with END */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap; /* Forces text to stay safely on a single line */
        }

        .countdown-status {
            font-size: 1.1rem;
            font-weight: 500;
            color: #777;
            margin-bottom: 4px;
        }

        .countdown-time {
            display: inline-block;
            /* clamp(MIN, PREFERRED, MAX) using Container Query Inline (cqi) */
            font-size: clamp(2.5rem, 18cqi, 6rem); 
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 4px 18px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
            white-space: nowrap; /* Forces the digits to stay on a single line */
            letter-spacing: -2px; /* Pulls the digits slightly closer together */
        }

		.next-announcement {
            font-size: 1.2rem; /* Roughly 1/3 of the main clock font */
            text-align: center;
            font-weight: 500;
            opacity: 0.85; /* Slight transparency so it doesn't overpower the clock */
            margin-top: -5px; 
            margin-bottom: 12px;
        }

        /* --- Base Countdown Colors (For ALL boards EXCEPT Maths) --- */
        #cards-grid .exam-card:not(.maths) .countdown-time {
            color: var(--board-theme-color);
            background-color: transparent;
        }

        /* --- Active Announcement Highlight (For ALL boards EXCEPT Maths) --- */
        #cards-grid .exam-card:not(.maths) .countdown-time[class*="highlighted-"] {
            background-color: var(--board-theme-color) !important;
            color: var(--card-base-bg) !important;
        }

        /* =========================================
           MATHS OLYMPIADS - EXCLUSIVE TIMER COLORS
           ========================================= */
           
        /* 1. DEFAULT STATE (JS applies the highlight class normally) */
        html body #cards-grid .exam-card.maths .countdown-time[class*="highlighted"] {
            background-color: #FFDA03 !important;
            color: #000000 !important;
        }
        
        /* Bulletproof: Force EVERY inner text element to be black */
        html body #cards-grid .exam-card.maths .countdown-time[class*="highlighted"] * {
            color: #000000 !important;
        }

        /* 2. ANNOUNCEMENT MINUTE (JS removes the class) */
        html body #cards-grid .exam-card.maths .countdown-time {
            background-color: #000000 !important;
            color: #FFDA03 !important;
        }
        
        /* Bulletproof: Force EVERY inner text element to swap to yellow */
        html body #cards-grid .exam-card.maths .countdown-time * {
            color: #FFDA03 !important;
        }

        /* Forces the inner text child to perfectly swap to yellow */
        html body #cards-grid .exam-card.maths.announcement .countdown-time .time-display,
        html body #cards-grid .exam-card.maths .countdown-time .time-display {
            background-color: transparent !important;
            color: #FFDA03 !important;
        }

        /* Editable start time */
        .start-edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .start-edit-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .start-edit-input {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 2px 6px; /* Increased right padding slightly */
            background: transparent;
            color: inherit;
            outline: none;
            text-align: right;
            
            /* A generous fixed width ensures the final zero is NEVER clipped */
            width: 120px; 
            
            /* Pushes exactly 8px rightward to seamlessly align text with the rows above/below */
            margin-right: -8px; 

            /* Browser address-bar style text-truncation behavior */
            overflow: hidden;
            white-space: nowrap;
            text-overflow: clip;
        }

        .start-edit-input:focus,
        .start-edit-input:hover {
            border-color: currentColor;
            background: rgba(0, 0, 0, 0.05);
        }

        .start-edit-input::-webkit-calendar-picker-indicator,
        .start-edit-input::-webkit-inner-spin-button,
        .start-edit-input::-webkit-clear-button {
            -webkit-appearance: none;
            appearance: none;
            display: none !important;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
        }

        /* Toast popup */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 32px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            z-index: 200;
            text-align: center;
            max-width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }

        #toast.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #toast-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #toast-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #toast p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
        }

        #toast button {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
        }

        #toast button:hover {
            opacity: 0.85;
        }

        /* Bottom controls */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-bottom {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 0.95rem;
            color: #555;
            cursor: pointer;
        }

        .btn-bottom:hover {
            background: #eee;
            color: #000;
        }

        /* Hidden file input */
        #file-input {

    <script>
        const MAX_TIMERS = 16;
        const timers = [];
        let nextId = 1;
        let tickInterval = null;

        const setupOverlay = document.getElementById('setup-overlay');
        const timerView = document.getElementById('timer-view');
        const cardsGrid = document.getElementById('cards-grid');
        const btnCancel = document.getElementById('btn-cancel');

        // --- Banner Geometry Observer ---
        const bannerObserver = new ResizeObserver((entries) => {
            for (let entry of entries) {
                const card = entry.target;
                
                // L is Horizontal width, W is Vertical height
                const L = card.clientWidth;  
                const W = card.clientHeight; 
                
                // Prevent calculations if the card is hidden or collapsed
                if (L === 0 && W === 0) continue;
                
                const a = Math.min(L, W);
                const b = Math.max(L, W);
                
                let h, v;
                if (b === W) {
                    h = 0.05 * a;
                    v = 0.20 * a;
                } else {
                    h = 0.20 * a;
                    v = 0.05 * a;
                }

                const den = W * W + L * L;
                const L2 = L * L;
                const W2 = W * W;

                // Point A 
                const Ax = h;
                const Ay = v;

                // Point B (Corrected orthogonal projection)
                const Bx = (2 * v * L * W + h * L2 - h * W2) / den;
                const By = (2 * h * L * W + v * W2 - v * L2) / den;

                // Point C 
                const Cx = L - h;
                const Cy = W - v;

                // Point D 
                const Dx = L - Bx;
                const Dy = W - By;

                // --- Calculate Midpoint M and the 4 Inset Points (A', B', C', D') ---
                const Mx = (Ax + Cx) / 2;
                const My = (Ay + Cy) / 2;
                
                // Define individual offsets (5% inset)
                const frameOffset = 0.05;
                const textOffset = 0.05;

                // Apply linear interpolation: (1 - offset) * POINT + offset * MIDPOINT
                const A_px = (1 - frameOffset) * Ax + frameOffset * Mx;
                const A_py = (1 - frameOffset) * Ay + frameOffset * My;

                const B_px = (1 - frameOffset) * Bx + frameOffset * Mx;
                const B_py = (1 - frameOffset) * By + frameOffset * My;

                const C_px = (1 - frameOffset) * Cx + frameOffset * Mx;
                const C_py = (1 - frameOffset) * Cy + frameOffset * My;

                const D_px = (1 - frameOffset) * Dx + frameOffset * Mx;
                const D_py = (1 - frameOffset) * Dy + frameOffset * My;

                // --- Calculate Text Span Segment UV ---
                // Midpoints of the inner frame's short edges (A'B' and C'D')
                const M_AB_x = (A_px + B_px) / 2;
                const M_AB_y = (A_py + B_py) / 2;
                
                const M_CD_x = (C_px + D_px) / 2;
                const M_CD_y = (C_py + D_py) / 2;

                // U and V pulled inward towards the exact center of the card (M)
                const U_x = (1 - textOffset) * M_AB_x + textOffset * Mx;
                const U_y = (1 - textOffset) * M_AB_y + textOffset * My;
                
                const V_x = (1 - textOffset) * M_CD_x + textOffset * Mx;
                const V_y = (1 - textOffset) * M_CD_y + textOffset * My;

                // Calculate the exact pixel length of the UV segment
                const uvLength = Math.hypot(V_x - U_x, V_y - U_y);

                // --- Calculate dimensions and EXACT angle for the decorative frame ---
                const rectThickness = Math.hypot(B_px - A_px, B_py - A_py);
                const rectLength = Math.hypot(D_px - A_px, D_py - A_py);

                // Calculate the exact angle of the inner frame's long edge (A' to D')
                const angleRad = Math.atan2(A_py - D_py, D_px - A_px);
                
                // Pass all geometric variables to CSS for real-time redrawing
                card.style.setProperty('--banner-thickness', `${rectThickness}px`);
                card.style.setProperty('--banner-length', `${rectLength}px`);
                card.style.setProperty('--uv-length', `${uvLength}px`);
                card.style.setProperty('--banner-angle', `${angleRad}rad`);

                // Map to CSS coordinates (Inverting Y: W - y) to match Top-Left CSS origin
                const polygon = `polygon(
                    ${Ax}px ${W - Ay}px, 
                    ${Bx}px ${W - By}px, 
                    ${Cx}px ${W - Cy}px, 
                    ${Dx}px ${W - Dy}px
                )`;
                card.style.setProperty('--banner-clip', polygon);
            }
        });

        // Central Data Presets for specific exams
        const examPresets = {
            "maths-kangaroo": { durationMin: 100, extraTimeSec: 0, customWarnings: [20, 5] },
            "maths-obmep": { durationMin: 150, extraTimeSec: 0, customWarnings: [20, 5] },
            "maths-jacob-palis": { durationMin: 150, extraTimeSec: 0, customWarnings: [15, 5] },
            
            "ib-higher-p1": { durationMin: 120 },
            "ib-higher-p2": { durationMin: 120 },
            "ib-higher-p3": { durationMin: 75 },
            "ib-standard-p1": { durationMin: 90 },
            "ib-standard-p2": { durationMin: 90 },
            
            "igcse-p2": { durationMin: 90 },
            "igcse-p4": { durationMin: 90 },
            "igcse-p6": { durationMin: 90 }
        };


        // Form refs
        const examBoardSelect = document.getElementById('exam-board');
        const examNameInput = document.getElementById('exam-name');
        const durationHoursInput = document.getElementById('duration-hours');
        const durationMinutesInput = document.getElementById('duration-minutes');
		const startTimeInput = document.getElementById('start-time');

        // Safely fetch custom inputs (if they exist in your HTML)
        const extraTimeTypeInput = document.getElementById('extra-time-type');
        const extraTimeValueInput = document.getElementById('extra-time-value');
        const customBoardNameInput = document.getElementById('custom-board-name');
        const customWarningTimesInput = document.getElementById('custom-warning-times');

        // Helpers
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function minutesToHM(totalMin) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `${h}h${pad(m)}m` : `${m}m`;
        }

        function timeStrToMinutes(str) {
            const parts = str.split(':').map(Number);
            const h = parts[0] || 0;
            const m = parts[1] || 0;
            const s = parts[2] || 0;
            return h * 60 + m + (s / 60);
        }

        function minutesToTimeStr(totalMin) {
            const totalSec = Math.round(totalMin * 60);
            const h = Math.floor(totalSec / 3600) % 24;
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (s === 0) {
                return `${pad(h)}:${pad(m)}`;
            } else {
                return `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
        }

        function nowSeconds() {
            const now = new Date();
            return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        }

        function nowMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        // Compute key times for a timer (Adapted for custom warnings & extra time)
        function computeTimes(board, startMin, durationMin, customWarnings = [], extraTimeSec = null, readingDurationMin = 0) {
            const times = [];
            const endMin = startMin + durationMin;

            if (readingDurationMin > 0) {
                times.push({ key: 'reading', label: 'READING', time: startMin - readingDurationMin });
            }
            
            times.push({ key: 'start', label: 'START', time: startMin });

            const isIB = board === 'IB' || board.startsWith('ib-');
            if (isIB && durationMin > 30) {
                times.push({ key: '30min', label: '30 MIN', time: endMin - 30 });
            }

            // Apply custom warnings if provided, otherwise default to 5 min
            if (customWarnings && customWarnings.length > 0) {
                customWarnings.forEach(w => {
                    if (durationMin > w) {
                        times.push({ key: `${w}min`, label: `${w} MIN`, time: endMin - w });
                    }
                });
            } 
            
            // Guarantee a preset 5-minute warning for Custom timers (and any exam > 5 mins)
            if (durationMin > 5 && !times.find(t => t.key === '5min')) {
                times.push({ key: '5min', label: '5 MIN', time: endMin - 5 });
            }

            times.push({ key: 'end', label: '<span class="end-label-wrapper"><span>End</span><span class="badge-regular" style="display: none;">Regular time finished</span></span>', time: endMin });

            // Handle extra time (Default is 25%, override if custom extraTimeSec is set)
            let extraMin = Math.round(durationMin * 0.25); 
            if (extraTimeSec !== null) {
                extraMin = Math.round(extraTimeSec / 60);
            }

            if (extraMin > 0) {
                const extraEndMin = endMin + extraMin;
                times.push({ key: 'extratime', label: 'EXTRA TIME', time: extraEndMin });
                
                // Dynamically inherit all regular minute warnings that were generated
                const generatedRegularWarnings = times
                    .filter(t => /^\d+min$/.test(t.key))
                    .map(t => parseInt(t.key.replace('min', '')));

                // Generate Extra Time Warnings (Hidden from UI)
                generatedRegularWarnings.forEach(w => {
                    if (extraMin >= w) {
                        times.push({ 
                            key: `extra-${w}min`, 
                            label: `${w} MIN`, 
                            time: extraEndMin - w,
                            isExtraWarning: true,
                            hiddenFromUI: true
                        });
                    }
                });
            }

            // Sort times chronologically
            times.sort((a, b) => a.time - b.time);

            return times;
        }

        // Show setup form
        function showSetup() {
            examNameInput.value = '';
            durationHoursInput.value = '0';
            durationMinutesInput.value = '45';
            const now = new Date();
            startTimeInput.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            examBoardSelect.value = 'Custom';

            if (extraTimeTypeInput) extraTimeTypeInput.value = 'percentage';
            if (extraTimeValueInput) extraTimeValueInput.value = '25';
            if (customWarningTimesInput) customWarningTimesInput.value = '';

            // Reset the extra warnings toggle
            const warningsContainer = document.getElementById('custom-warnings-container');
            const warningsBtn = document.getElementById('btn-toggle-warnings');
            if (warningsContainer) warningsContainer.style.display = 'none';
            if (warningsBtn) warningsBtn.textContent = '+ Add Extra Warnings';

            btnCancel.style.display = timers.length > 0 ? 'block' : 'none';
            setupOverlay.classList.remove('hidden');
        }

        // Build a card DOM element for a timer
        function buildCard(timer) {
            const card = document.createElement('div');
            
            // Attach the exact geometry observer to this card
            bannerObserver.observe(card);
            
            // Map the internal ID to a clean display name
            const boardLabelMap = {
                'ib-higher-p1': 'IB - Higher Paper 1',
                'ib-higher-p2': 'IB - Higher Paper 2',
                'ib-higher-p3': 'IB - Higher Paper 3',
                'ib-standard-p1': 'IB - Standard Paper 1',
                'ib-standard-p2': 'IB - Standard Paper 2',
                'igcse-p2': 'IGCSE - Paper 2',
                'igcse-p4': 'IGCSE - Paper 4',
                'igcse-p6': 'IGCSE - Paper 6',
                'maths-kangaroo': 'Maths Kangaroo',
                'maths-obmep': 'Maths OBMEP',
                'maths-jacob-palis': 'Maths Jacob Palis Jr',
                'IB': 'IB (Custom)',
                'IGCSE': 'IGCSE (Custom)'
            };
            const displayBoardText = boardLabelMap[timer.board] || timer.board;

            // Apply proper CSS classes
            const isIB = timer.board === 'IB' || timer.board.startsWith('ib-');
            const isMaths = timer.board.toLowerCase().startsWith('maths');
            const isCustom = timer.board === 'Custom';

            let boardClass = 'igcse'; // default
            if (isIB) boardClass = 'ib';
            else if (isMaths) boardClass = 'maths';
            else if (isCustom) boardClass = 'custom';
            
            card.className = `exam-card ${boardClass}`;
            card.dataset.timerId = timer.id;
            card.draggable = true;

            card.addEventListener('mousedown', (e) => {
                if (e.target.closest('button, input')) {
                    card.draggable = false;
                }
            });
            card.addEventListener('mouseup', () => { card.draggable = true; });

            const removeBtn = document.createElement('button');
            removeBtn.className = 'card-remove';
            removeBtn.textContent = '\u00d7';
            removeBtn.addEventListener('click', () => removeTimer(timer.id));
            card.appendChild(removeBtn);

            // Create the new inner wrapper to separate Flexbox resizing from Container Queries
            const innerWrapper = document.createElement('div');
            innerWrapper.className = 'exam-card-inner';

            const boardLabel = document.createElement('div');
            boardLabel.className = 'exam-board-label';
            boardLabel.textContent = timer.customBoardName || displayBoardText;
            innerWrapper.appendChild(boardLabel);

            const nameLabel = document.createElement('div');
            nameLabel.className = 'exam-name';
            nameLabel.textContent = timer.name;
            innerWrapper.appendChild(nameLabel);

            const durLabel = document.createElement('div');
            durLabel.className = 'exam-duration-label';
            durLabel.textContent = minutesToHM(timer.durationMin);
            innerWrapper.appendChild(durLabel);

            const rowsContainer = document.createElement('div');
			rowsContainer.className = 'time-rows';

			function renderRows() {
				rowsContainer.innerHTML = '';
				timer.times.forEach(t => {
					if (t.key === 'reading' || t.key === 'start') {
						const row = document.createElement('div');
						row.className = 'start-edit-row';
						row.dataset.key = t.key;

						row.innerHTML = `
							<div class="label" style="display:flex; align-items:center;">
								${t.label}
							</div>
							<input type="text" class="start-edit-input" value="${minutesToTimeStr(t.time)}" pattern="([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?" lang="en-GB">
						`;
						rowsContainer.appendChild(row);

						const input = row.querySelector('.start-edit-input');
						input.addEventListener('change', (e) => {
							if (input.checkValidity()) {
								const newTime = timeStrToMinutes(e.target.value);
								if (t.key === 'reading') {
									timer.startMin = newTime + timer.readingDurationMin;
								} else {
									timer.startMin = newTime;
								}
								timer.times = computeTimes(timer.board, timer.startMin, timer.durationMin, timer.customWarnings, timer.extraTimeSec, timer.readingDurationMin);
								refreshCardRows(timer);
							} else {
								input.value = minutesToTimeStr(t.time);
							}
						});
					} else {
                        if (t.hiddenFromUI) return; // Skip rendering hidden milestones
                        
						const row = document.createElement('div');
						row.className = 'time-row';
						row.dataset.key = t.key;
                        
                        if (t.key === 'extratime') {
                            row.innerHTML = `
                                <span class="label"><span class="extra-label-text">${t.label}</span><span class="extra-badge"></span></span>
                                <span class="value">${minutesToTimeStr(t.time)}</span>
                            `;
                        } else {
                            row.innerHTML = `
                                <span class="label">${t.label}</span>
                                <span class="value">${minutesToTimeStr(t.time)}</span>
                            `;
                        }
						rowsContainer.appendChild(row);
					}
				});
			}
			
			timer.renderRows = renderRows;
			renderRows();

			innerWrapper.appendChild(rowsContainer);

            const countdownSection = document.createElement('div');
            countdownSection.className = 'countdown-section';
            countdownSection.innerHTML = `
                <div class="exam-finished-banner" id="banner-${timer.id}">
                    <div class="exam-finished-frame">
                        <div class="exam-finished-text">EXAM HAS FINISHED</div>
                    </div>
                </div>
                <div class="countdown-status"></div>
                <div class="countdown-time">--:--</div>
            `;
            innerWrapper.appendChild(countdownSection);
            
            // Append the entire wrapper to the main card
            card.appendChild(innerWrapper);

            timer.el = card;
            return card;
        }

        function refreshCardRows(timer) {
            if (timer.renderRows) {
                timer.renderRows();
            }
        }

        function addTimer(data) {
            if (timers.length >= MAX_TIMERS) {
                alert('Maximum of ' + MAX_TIMERS + ' timers reached.');
                return;
            }

            const timer = {
                id: nextId++,
                board: data.board,
                name: data.name,
                durationMin: data.durationMin,
                startMin: data.startMin,
                customBoardName: data.customBoardName,
                customWarnings: data.customWarnings,
                extraTimeSec: data.extraTimeSec,
                readingDurationMin: data.readingDurationMin,
                times: computeTimes(data.board, data.startMin, data.durationMin, data.customWarnings, data.extraTimeSec, data.readingDurationMin),
                el: null
            };

            timers.push(timer);
            const card = buildCard(timer);

            cardsGrid.appendChild(card);
            setupOverlay.classList.add('hidden');
            timerView.classList.add('active');

            if (!tickInterval) {
                tick();
                tickInterval = setInterval(tick, 1000);
            }

            if (timers.length === 1) {
                showToast();
            }
        }

        function showToast() {
            document.getElementById('toast').classList.add('visible');
            document.getElementById('toast-backdrop').classList.add('visible');
        }

        function hideToast() {
            document.getElementById('toast').classList.remove('visible');
            document.getElementById('toast-backdrop').classList.remove('visible');
        }

        function removeTimer(id) {
            const idx = timers.findIndex(t => t.id === id);
            if (idx === -1) return;
            const timer = timers[idx];
            timer.el.remove();
            timers.splice(idx, 1);

            if (timers.length === 0) {
                clearInterval(tickInterval);
                tickInterval = null;
                timerView.classList.remove('active');
                showSetup();
            }
        }

        function tick() {
            const now = new Date();
            document.getElementById('current-time').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const currentMin = nowMinutes();
            const currentSec = nowSeconds();

            // Calculate global next announcement across all timers
            let nextGlobalMilestoneTime = null;
            timers.forEach(timer => {
                const nextMilestone = timer.times.find(t => currentMin < t.time);
                if (nextMilestone) {
                    if (nextGlobalMilestoneTime === null || nextMilestone.time < nextGlobalMilestoneTime) {
                        nextGlobalMilestoneTime = nextMilestone.time;
                    }
                }
            });

            const globalNextAnnEl = document.getElementById('next-announcement');
            if (globalNextAnnEl) {
                if (nextGlobalMilestoneTime !== null) {
                    globalNextAnnEl.textContent = `Next announcement: ${minutesToTimeStr(nextGlobalMilestoneTime)}`;
                } else {
                    globalNextAnnEl.textContent = `Next announcement: ---`;
                }
            }

            timers.forEach(timer => {
                let highlightClass = 'highlighted-igcse'; 
                if (timer.board === 'IB' || timer.board.startsWith('ib-')) highlightClass = 'highlighted-ib';
                if (timer.board.toLowerCase().startsWith('maths')) highlightClass = 'highlighted-maths';
                if (timer.board === 'Custom') highlightClass = 'highlighted-custom';

                const rowsContainer = timer.el.querySelector('.time-rows');
                const rows = rowsContainer.children;

                let currentIdx = -1;
                let activeMilestones = [];
                timer.times.forEach((t, i) => {
                    if (currentMin >= t.time) currentIdx = i;
                    if (currentMin === t.time) activeMilestones.push(t);
                });

                const statusEl = timer.el.querySelector('.countdown-status');
                const countdownEl = timer.el.querySelector('.countdown-time');
				const bannerEl = timer.el.querySelector('.exam-finished-banner');

                const endTime = timer.times.find(t => t.key === 'end');
                const startTime = timer.times.find(t => t.key === 'start');
                const readingTime = timer.times.find(t => t.key === 'reading');
                const extraTime = timer.times.find(t => t.key === 'extratime');

                const endSec = endTime.time * 60;
                const startSec = startTime.time * 60;
                const readingSec = readingTime ? readingTime.time * 60 : null;
                const finalSec = extraTime ? extraTime.time * 60 : endSec;

                // Handle the "Regular time finished" badge visibility
                const endRow = timer.el.querySelector('.time-row[data-key="end"]');
                if (endRow) {
                    const badge = endRow.querySelector('.badge-regular');
                    if (badge) {
                        badge.style.display = currentSec >= endSec ? 'inline-block' : 'none';
                    }
                }

                // Cleanup all highlights
                Array.from(rows).forEach(row => {
                    // Remove legacy row highlights just in case
                    row.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-maths', 'highlighted-custom', 'active-extra-warning');
                    
                    // Target the label specifically for cleanup
                    const label = row.querySelector('.label');
                    if (label) {
                        label.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-maths', 'highlighted-custom', 'active-extra-warning', 'active-extra-indicator');
                    }
                    
                    // Ensure the extra badge stays hidden forever
                    const badge = row.querySelector('.extra-badge');
                    if (badge) {
                        badge.style.display = 'none';
                    }
                });
                countdownEl.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-maths', 'highlighted-custom');

                // Apply highlights based on active milestones
                if (activeMilestones.length > 0) {
                    const regularMilestones = activeMilestones.filter(t => !t.isExtraWarning);
                    const extraMilestones = activeMilestones.filter(t => t.isExtraWarning);
                    
                    // Process Regular Milestones Independently
                    if (regularMilestones.length > 0) {
                        const regRow = timer.el.querySelector(`[data-key="${regularMilestones[0].key}"]`);
                        if (regRow) {
                            const label = regRow.querySelector('.label');
                            if (label) {
                                label.classList.add(highlightClass);
                            } else {
                                regRow.classList.add(highlightClass); // Fallback
                            }
                        }
                    }

                    // Process Extra Time Milestones Independently
                    if (extraMilestones.length > 0) {
                        const extraKey = extraMilestones[0].key.replace('extra-', '');
                        const matchingRegRow = timer.el.querySelector(`[data-key="${extraKey}"]`);
                        if (matchingRegRow) {
                            const label = matchingRegRow.querySelector('.label');
                            if (label) {
                                label.classList.add('active-extra-warning');
                            } else {
                                matchingRegRow.classList.add('active-extra-warning'); // Fallback
                            }
                        }

                        // Also highlight the EXTRA TIME row to clarify the warning's context
                        const extraTimeRow = timer.el.querySelector('[data-key="extratime"]');
                        if (extraTimeRow) {
                            const extraLabel = extraTimeRow.querySelector('.label');
                            if (extraLabel) {
                                extraLabel.classList.add('active-extra-indicator');
                            }
                        }
                    }
                } else if (currentIdx >= 0 && currentSec < finalSec) {
                    countdownEl.classList.add(highlightClass);
                }

                // Hide banner by default for all active states
                if (bannerEl) bannerEl.style.display = 'none';

                if (currentSec >= finalSec) {
                    statusEl.textContent = 'EXAM ENDED';
                    countdownEl.textContent = '00:00:00';
                    countdownEl.classList.remove('warning', 'danger');
                    statusEl.textContent = 'Exam Finished';
                    if (bannerEl) bannerEl.style.display = 'flex'; // SHOW BANNER
                } else if (currentSec >= endSec) {
                    statusEl.textContent = 'Extra Time';
                    const rem = finalSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (currentSec >= startSec) {
                    statusEl.textContent = 'Time Remaining';
                    const rem = endSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (readingSec !== null && currentSec >= readingSec) {
                    statusEl.textContent = 'Reading Time';
                    const rem = startSec - currentSec;
                    const rm = Math.floor(rem / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = `${pad(rm)}:${pad(rs)}`;
                } else {
                    const waitTarget = readingSec !== null ? readingSec : startSec;
                    statusEl.textContent = 'Waiting to Start';
                    const rem = waitTarget - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                }
            });
        }

        // --- Event listeners ---
		
		// Toggle Extra Warnings Input
        const btnToggleWarnings = document.getElementById('btn-toggle-warnings');
        const customWarningsContainer = document.getElementById('custom-warnings-container');
        
        btnToggleWarnings.addEventListener('click', () => {
            if (customWarningsContainer.style.display === 'none') {
                customWarningsContainer.style.display = 'block';
                btnToggleWarnings.textContent = '- Hide Extra Warnings';
            } else {
                customWarningsContainer.style.display = 'none';
                btnToggleWarnings.textContent = '+ Add Extra Warnings';
                if (customWarningTimesInput) customWarningTimesInput.value = '';
            }
        });

        // Start timer
        document.getElementById('btn-start').addEventListener('click', () => {
            const board = examBoardSelect.value;
            const name = examNameInput.value.trim() || 'Unnamed Exam';
            const hours = parseInt(durationHoursInput.value) || 0;
            const minutes = parseInt(durationMinutesInput.value) || 0;
            const durationMin = hours * 60 + minutes;

            if (durationMin <= 0) {
                alert('Please enter a valid duration.');
                return;
            }

            // Capture the reading duration from the new Phase 6 input
            const readingDurationMin = parseFloat(document.getElementById('reading-duration').value) || 0;

            if (!/^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$/.test(startTimeInput.value)) {
                alert('Please enter a valid start time (24-hour, HH:MM or HH:MM:SS, 00:00 to 23:59:59).');
                return;
            }
            const startMin = timeStrToMinutes(startTimeInput.value);

            let customBoardName = null;
            if (board === 'Custom') {
                customBoardName = prompt('Enter custom board name:', 'Custom Board') || 'Custom';
            } else if (typeof customBoardNameInput !== 'undefined' && customBoardNameInput) {
                customBoardName = customBoardNameInput.value || null;
            }

            // Resolve Custom Warnings (Restoring your preset fallback logic)
            let customWarnings = [];
            if (typeof customWarningTimesInput !== 'undefined' && customWarningTimesInput && customWarningTimesInput.value.trim() !== '') {
                customWarnings = customWarningTimesInput.value.split(',')
                    .map(s => parseInt(s.trim()))
                    .filter(n => !isNaN(n));
            }
            if (customWarnings.length === 0 && typeof examPresets !== 'undefined' && examPresets[board] && examPresets[board].customWarnings) {
                customWarnings = [...examPresets[board].customWarnings]; 
            }
            if (customWarnings.length > 0) {
                customWarnings.sort((a, b) => b - a);
            }

            // Resolve Extra Time
            let extraTimeSec = null;
            if (typeof extraTimeTypeInput !== 'undefined' && extraTimeTypeInput && extraTimeValueInput) {
                const extraTimeType = extraTimeTypeInput.value;
                const extraTimeValue = parseFloat(extraTimeValueInput.value) || 0;
                
                if (extraTimeType === 'percentage') {
                    extraTimeSec = (durationMin * 60) * (extraTimeValue / 100);
                } else if (extraTimeType === 'absolute') {
                    extraTimeSec = extraTimeValue * 60;
                } else if (extraTimeType === 'none') {
                    extraTimeSec = 0;
                }
            }

            // Pass everything to the generator
            const data = { board, name, durationMin, startMin, customBoardName, customWarnings, extraTimeSec, readingDurationMin };
            addTimer(data);
        });

        btnCancel.addEventListener('click', () => {
            setupOverlay.classList.add('hidden');
        });

		// Auto-fill durations and extra time based on exam selection
        examBoardSelect.addEventListener('change', (e) => {
            const board = e.target.value;
            let totalMins = 0;

            // 0. Handle Reading Time Defaults
            const readingDurationInput = document.getElementById('reading-duration');
            if (readingDurationInput) {
                // If the board's value contains "IB" (case-insensitive), default to 5
                if (board.toUpperCase().includes('IB')) {
                    readingDurationInput.value = '5';
                } else {
                    readingDurationInput.value = '0';
                }
            }

            // 1. Handle Extra Time Defaults
            if (board.startsWith('maths-')) {
                if (extraTimeTypeInput) extraTimeTypeInput.value = 'none';
                if (extraTimeValueInput) extraTimeValueInput.value = '0';
            } else {
                if (extraTimeTypeInput) extraTimeTypeInput.value = 'percentage';
                if (extraTimeValueInput) extraTimeValueInput.value = '25';
            }

            // 2. Handle Duration Defaults
            if (examPresets[board] && examPresets[board].durationMin) {
                // Maths Olympiads (pulls from your preset database)
                totalMins = examPresets[board].durationMin;
            } else if (board === 'Custom') {
                // Custom default
                totalMins = 45;
            } else if (board === 'IB' || board === 'IGCSE') {
                // IB and IGCSE default
                totalMins = 90;
            }

            // Apply the calculated duration to the input boxes
            if (totalMins > 0) {
                durationHoursInput.value = Math.floor(totalMins / 60);
                durationMinutesInput.value = totalMins % 60;
            }
        });

        // Load button
        document.getElementById('btn-load').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    let data = JSON.parse(evt.target.result);
                    if (!Array.isArray(data)) data = [data];

                    timers.forEach(t => t.el.remove());
                    timers.length = 0;

                    data.forEach(d => {
                        if (d.board && d.name && d.durationMin && d.startMin !== undefined) {
                            addTimer(d);
                        }
                    });

                    if (timers.length === 0) {
                        alert('No valid timers found in file.');
                        showSetup();
                    }
                } catch {
                    alert('Could not read timer file.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // Download button
        document.getElementById('btn-download').addEventListener('click', () => {
            if (timers.length === 0) return;
            const saveData = timers.map(t => ({
                board: t.board,
                name: t.name,
                durationMin: t.durationMin,
                startMin: t.startMin,
                customBoardName: t.customBoardName,
                customWarnings: t.customWarnings,
                extraTimeSec: t.extraTimeSec
            }));
            const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timer.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- Drag and drop reordering ---
        let draggedCard = null;

        cardsGrid.addEventListener('dragstart', (e) => {
            const card = e.target.closest('.exam-card');
            if (!card) { e.preventDefault(); return; }
            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        cardsGrid.addEventListener('dragend', (e) => {
            if (draggedCard) {
                draggedCard.classList.remove('dragging');
                draggedCard = null;
            }
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        cardsGrid.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.exam-card');
            if (!target || target === draggedCard) return;
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            target.classList.add('drag-over');
        });

        cardsGrid.addEventListener('dragleave', (e) => {
            const target = e.target.closest('.exam-card');
            if (target) target.classList.remove('drag-over');
        });

        cardsGrid.addEventListener('drop', (e) => {
            e.preventDefault();
            const target = e.target.closest('.exam-card');
            if (!target || !draggedCard || target === draggedCard) return;
            target.classList.remove('drag-over');

            const allCards = [...cardsGrid.querySelectorAll('.exam-card')];
            const dragIdx = allCards.indexOf(draggedCard);
            const dropIdx = allCards.indexOf(target);

            if (dragIdx < dropIdx) {
                cardsGrid.insertBefore(draggedCard, target.nextSibling);
            } else {
                cardsGrid.insertBefore(draggedCard, target);
            }

            const newOrder = [...cardsGrid.querySelectorAll('.exam-card')].map(
                el => timers.find(t => t.id === Number(el.dataset.timerId))
            ).filter(Boolean);
            timers.length = 0;
            timers.push(...newOrder);
        });

        document.getElementById('toast-dismiss').addEventListener('click', hideToast);
        document.getElementById('toast-backdrop').addEventListener('click', hideToast);

        // Force the presets to load based on the default selected dropdown option
        examBoardSelect.dispatchEvent(new Event('change'));

        showSetup();
    </script>
</body>
</html>
